[project]
name = "vn-reverse-geocoding"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["shapely>=2.0", "pyarrow>=14.0", "requests>=2.31"]

[project.optional-dependencies]
# pandas KHONG phai tuy chon: apache-sedona import no luc nap module nhung
# khong khai bao la phu thuoc bat buoc. Xem docs/environment.md.
spark = ["pyspark==4.0.4", "apache-sedona==1.9.1", "pandas>=2.0"]
dev = ["pytest>=7.4"]

[project.scripts]
vn-geo-build = "vn_geo_build.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["spark: can SparkSession local, chay cham"]
